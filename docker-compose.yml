# Fase 3 — PostGIS + API
# Uso: docker compose up -d
# Depois: copy api/.env.example → api/.env com DATABASE_URL abaixo

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: fisaval
      POSTGRES_PASSWORD: fisaval
      POSTGRES_DB: fisaval
    ports:
      - '5432:5432'
    volumes:
      - fisaval_pg:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U fisaval']
      interval: 5s
      timeout: 5s
      retries: 5

volumes:
  fisaval_pg:
