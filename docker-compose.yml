# Fase 3 — subir quando for usar PostGIS de verdade
# Uso: docker compose up -d

services:
  db:
    image: postgis/postgis:16-3.4
    environment:
      POSTGRES_USER: fisaval
      POSTGRES_PASSWORD: fisaval
      POSTGRES_DB: fisaval
    ports:
      - '5432:5432'
    volumes:
      - fisaval_pg:/var/lib/postgresql/data

volumes:
  fisaval_pg:
