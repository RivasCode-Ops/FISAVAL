name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Build app
        working-directory: app
        env:
          VITE_API_URL: ${{ secrets.VITE_API_URL }}
        run: |
          npm ci
          if [ -n "$VITE_API_URL" ]; then
            echo "VITE_API_URL=$VITE_API_URL" > .env
            echo "Build com API: $VITE_API_URL"
          else
            echo "::notice::Secret VITE_API_URL não definido — site em modo local (IndexedDB). Ver docs/DEPLOY-ONLINE.md"
          fi
          npm run build:pages

      - name: Prepare site (docs/)
        run: |
          node scripts/copy-to-docs.mjs
          cp docs/index.html docs/404.html

      # Publica na branch gh-pages (não exige "GitHub Actions" em Settings)
      - name: Deploy to gh-pages branch
        uses: peaceiris/actions-gh-pages@v4
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          publish_dir: ./docs
          force_orphan: true
